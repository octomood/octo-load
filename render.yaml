# Render Blueprint — free web service with a keep-alive health endpoint.
# Free plan sleeps after 15 minutes without traffic, so ping /healthz
# from cron-job.org (or similar) every 10 minutes, or use a real VPS.
services:
  - type: web
    name: octo-load
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WORK_DIR
        value: /tmp/octo-load
      - key: MAX_CONCURRENT
        value: "1"
      - key: MAX_HEIGHT
        value: "720"
      - key: RATE_LIMIT_PER_HOUR
        value: "10"
      - key: LOG_LEVEL
        value: INFO
