# Render Blueprint — free web service with a keep-alive health endpoint.
# Free plan sleeps after 15 min without inbound traffic; the bot pings its own
# RENDER_EXTERNAL_URL/healthz every 10 minutes, so no external cron is needed.
services:
  - type: web
    name: octo-load
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WORK_DIR
        value: /tmp/octo-load
      - key: MAX_CONCURRENT
        value: "1"
      - key: MAX_HEIGHT
        value: "720"
      - key: RATE_LIMIT_PER_HOUR
        value: "10"
      - key: LOG_LEVEL
        value: INFO
